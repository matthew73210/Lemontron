#####################################################################
#   Probe
#####################################################################

## Microprobe
[output_pin probe_enable]
pin: toolhead:PB9 # The control IO pin
value: 0 # Probe default retracted

[probe]
pin: ^!toolhead:PB8
deactivate_on_each_sample: False
x_offset: 24
y_offset: -24
#z_offset: -0.8
speed: 5
samples: 2
sample_retract_dist: 2
samples_tolerance: 0.05
samples_tolerance_retries: 3
samples_result: median
activate_gcode:
    PROBE_DEPLOY
    G4 P200

deactivate_gcode:
    PROBE_RETRACT
